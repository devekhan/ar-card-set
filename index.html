<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AR Card Set</title>
<link rel="stylesheet" href="style.css" />
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- Simple loading / status overlay -->
  <div id="overlay">
    <p id="status">Point your camera at one of your printed AR cards.</p>
  </div>

  <!--
    mindar-image = "imageTargetSrc: assets/targets/targets.mind"
    That .mind file is a COMPILED version of your card art.
    You generate it yourself (free, browser-based) — see README.md step 3.
    It can contain MULTIPLE targets (one per card) in a single file.
    Each <a-entity mindar-image-target="targetIndex: N"> below corresponds
    to the Nth image you fed into the compiler, in the order you added them.
  -->
  <a-scene
    mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: true; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <!-- Add one <a-asset-item> per 3D model. id is referenced below. -->
      <a-asset-item id="model-0" src="assets/models/card-0.glb"></a-asset-item>
      <a-asset-item id="model-1" src="assets/models/card-1.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- CARD 0 -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        id="zoomable-0"
        rotation="0 0 0"
        position="0 0 0.1"
        scale="0.15 0.15 0.15"
        src="#model-0"
        animation-mixer
      ></a-gltf-model>
    </a-entity>

    <!-- CARD 1 -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model
        id="zoomable-1"
        rotation="0 0 0"
        position="0 0 0.1"
        scale="1 1 1"
        src="#model-1"
        animation-mixer
      ></a-gltf-model>
    </a-entity>

    <!-- To add a 2nd, 3rd... card: add another <a-asset-item>,
         another <a-entity mindar-image-target="targetIndex: N">,
         and re-compile targets.mind with N+1 images in the same order. -->
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const status = document.getElementById('status');
    const overlay = document.getElementById('overlay');

    sceneEl.addEventListener('arReady', () => {
      status.textContent = 'Camera ready. Point at a card.';
      setTimeout(() => overlay.classList.add('hidden'), 1500);
    });
    sceneEl.addEventListener('arError', () => {
      status.textContent = 'Camera failed to start. Check permissions and reload.';
      overlay.classList.remove('hidden');
    });

    document.querySelectorAll('[mindar-image-target]').forEach((el, i) => {
      el.addEventListener('targetFound', () => { status.textContent = `Card ${i} found!`; overlay.classList.add('hidden'); });
      el.addEventListener('targetLost', () => { status.textContent = 'Point your camera at a card.'; overlay.classList.remove('hidden'); });
    });

    // Show model load errors directly on screen (helps debugging on mobile,
    // where there's no easy access to the browser console).
    document.querySelectorAll('a-gltf-model').forEach((el) => {
      el.addEventListener('model-error', (e) => {
        overlay.classList.remove('hidden');
        status.textContent = `Model failed to load (${el.id}): ${e.detail?.src || 'unknown error'}`;
      });
    });

    // --- Recenter each model on its own geometric center once it loads ---
    // Many downloaded/exported models are NOT centered at their local origin
    // (e.g. origin sits at the feet). Rotating an off-center model makes it
    // swing around in a circle ("standing on a globe") instead of spinning
    // in place. This shifts the loaded mesh so its bounding-box center sits
    // exactly at the parent entity's origin, fixing that.
    const baseScales = { 'zoomable-0': 0.15, 'zoomable-1': 1 };
    Object.keys(baseScales).forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('model-loaded', (e) => {
        const mesh = e.detail.model;
        const box = new THREE.Box3().setFromObject(mesh);
        const center = new THREE.Vector3();
        box.getCenter(center);
        mesh.position.sub(center);
      });
    });

    // --- Interactive 3D model controls: auto-rotate, smooth pinch-zoom, drag-rotate ---
    // "target" = where we WANT the value to be (set instantly by gestures)
    // "current" = what's actually displayed (eases toward target every frame = smoothness)
    const targetScales = { ...baseScales };
    const displayScales = { ...baseScales };

    const targetRotations = { 'zoomable-0': { x: 0, y: 0 }, 'zoomable-1': { x: 0, y: 0 } };
    const displayRotations = { 'zoomable-0': { x: 0, y: 0 }, 'zoomable-1': { x: 0, y: 0 } };

    const MIN_SCALE_MULT = 0.2;   // don't let it shrink below 20% of base
    const MAX_SCALE_MULT = 10;    // allow zooming up to 1000% of base for close inspection

    const ZOOM_SMOOTHING = 0.18;     // higher = snappier, lower = smoother/slower (0-1)
    const ROTATE_SMOOTHING = 0.25;   // smoothing for manual drag rotation
    const AUTO_ROTATE_SPEED = 12;    // degrees per second, auto clockwise spin
    const RESUME_AUTOROTATE_DELAY = 1500; // ms after user releases touch before auto-spin resumes

    let pinchStartDist = null;
    let pinchStartScales = {};
    let dragStart = null;       // { x, y } screen coords when 1-finger drag begins
    let dragStartRotations = {};
    let userInteracting = false;
    let resumeTimeout = null;
    let lastFrameTime = performance.now();

    function getTouchDist(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getVisibleZoomables() {
      // Only affect models whose parent target is currently being tracked/visible
      return Object.keys(baseScales)
        .map(id => document.getElementById(id))
        .filter(el => el && el.object3D && el.object3D.visible);
    }

    function pauseAutoRotate() {
      userInteracting = true;
      if (resumeTimeout) clearTimeout(resumeTimeout);
    }

    function scheduleResumeAutoRotate() {
      if (resumeTimeout) clearTimeout(resumeTimeout);
      resumeTimeout = setTimeout(() => { userInteracting = false; }, RESUME_AUTOROTATE_DELAY);
    }

    window.addEventListener('touchstart', (e) => {
      pauseAutoRotate();
      if (e.touches.length === 2) {
        dragStart = null;
        pinchStartDist = getTouchDist(e.touches);
        pinchStartScales = {};
        getVisibleZoomables().forEach(el => {
          pinchStartScales[el.id] = targetScales[el.id] || baseScales[el.id];
        });
      } else if (e.touches.length === 1) {
        pinchStartDist = null;
        dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        dragStartRotations = {};
        getVisibleZoomables().forEach(el => {
          dragStartRotations[el.id] = { ...(targetRotations[el.id] || { x: 0, y: 0 }) };
        });
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && pinchStartDist) {
        const newDist = getTouchDist(e.touches);
        const ratio = newDist / pinchStartDist;

        getVisibleZoomables().forEach(el => {
          const base = baseScales[el.id];
          const startScale = pinchStartScales[el.id] || base;
          let newScale = startScale * ratio;
          newScale = Math.max(base * MIN_SCALE_MULT, Math.min(base * MAX_SCALE_MULT, newScale));
          targetScales[el.id] = newScale; // eased toward this in the animation loop below
        });
      } else if (e.touches.length === 1 && dragStart) {
        const dx = e.touches[0].clientX - dragStart.x;
        const dy = e.touches[0].clientY - dragStart.y;
        const ROTATE_SENSITIVITY = 0.5; // degrees per pixel dragged

        getVisibleZoomables().forEach(el => {
          const startRot = dragStartRotations[el.id] || { x: 0, y: 0 };
          const newY = startRot.y + dx * ROTATE_SENSITIVITY;
          const newX = startRot.x + dy * ROTATE_SENSITIVITY;
          targetRotations[el.id] = { x: newX, y: newY };
        });
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) pinchStartDist = null;
      if (e.touches.length < 1) {
        dragStart = null;
        scheduleResumeAutoRotate();
      }
    }, { passive: true });

    // Main animation loop: eases scale/rotation smoothly, and auto-spins when idle
    function animate(now) {
      const dt = (now - lastFrameTime) / 1000; // seconds since last frame
      lastFrameTime = now;

      getVisibleZoomables().forEach(el => {
        const id = el.id;

        // --- Smooth zoom: ease display scale toward target scale ---
        const target = targetScales[id] ?? baseScales[id];
        const display = displayScales[id] ?? target;
        const newDisplay = display + (target - display) * ZOOM_SMOOTHING;
        displayScales[id] = newDisplay;
        el.setAttribute('scale', `${newDisplay} ${newDisplay} ${newDisplay}`);

        // --- Rotation: auto-spin clockwise when idle, smooth manual rotation otherwise ---
        if (!userInteracting) {
          // Auto-rotate: increment Y steadily (clockwise as viewed from the front)
          targetRotations[id].y -= AUTO_ROTATE_SPEED * dt;
        }
        const rot = displayRotations[id];
        const tRot = targetRotations[id];
        rot.x += (tRot.x - rot.x) * ROTATE_SMOOTHING;
        rot.y += (tRot.y - rot.y) * ROTATE_SMOOTHING;
        el.setAttribute('rotation', `${rot.x} ${rot.y} 0`);
      });

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
